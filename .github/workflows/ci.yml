name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017/lifeledger_test
